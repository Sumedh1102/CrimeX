[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crimex"
version = "0.1.0"
description = "Explainable spatiotemporal crime-intelligence platform (decision support, zone-level only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "pydantic>=2.7",
  "pyyaml>=6",
  "global-land-mask>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Only needed to re-extract the official statistics from the source PDF.
official = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pdfplumber>=0.11"]

[tool.setuptools.packages.find]
include = ["ml*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:xgboost.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N802", "N803", "N806"]  # formula notation (N_zc, C_j, W, K) mirrors the spec

[tool.ruff.lint.isort]
known-first-party = ["ml", "backend"]
